name: "Lint & Test PR"

on:
    pull_request:
        types: [ opened, synchronize, reopened ]

permissions:
    pull-requests: read

jobs:
    main:
        name: Pint, Rector & Test with coverage
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [ ubuntu-latest, macos-latest, windows-latest ]
                php: [ 8.3, 8.4 ]
        steps:
            -   name: Checkout Code
                uses: actions/checkout@v5
                with:
                    fetch-depth: 0

            -   name: "Check PR title"
                uses: amannn/action-semantic-pull-request@v5
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: "Setup PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: json, dom, curl, libxml, mbstring, fileinfo, intl, zip, iconv, sqlite3, pdo_sqlite
                    coverage: xdebug

            -   name: "Install Composer Dependencies"
                run: |
                    composer install --no-interaction --prefer-dist --optimize-autoloader --no-ansi --no-progress

            -   name: "Run Rector"
                run: |
                    ./vendor/bin/rector process --dry-run --config=rector.php

            -   name: "Run Pint"
                run: |
                    ./vendor/bin/pint --config=pint.json --test --verbose --dirty

            -   name: "Run PHPStan Analysis"
                run: |
                    ./vendor/bin/phpstan analyse --error-format=github

            -   name: "Run Tests"
                run: |
                    ./vendor/bin/pest --colors=always --stop-on-failure --coverage --coverage-clover=coverage.xml --ci
